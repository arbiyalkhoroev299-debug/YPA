<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YahaPhotographerApp</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YahaPhoto">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        header {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            border-bottom: 1px solid #333333;
            padding-bottom: 10px;
            width: 100%;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .upload-card {
            border: 1px dashed #444444;
            border-radius: 12px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background-color: #0a0a0a;
            cursor: pointer;
        }

        .upload-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .upload-icon {
            font-size: 32px;
            color: #888888;
            margin-bottom: 8px;
        }

        .upload-text {
            color: #666666;
            font-size: 13px;
        }

        input[type="file"] { display: none; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888888;
        }

        input[type="text"], input[type="password"] {
            background-color: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 12px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #ffffff;
        }

        .btn-analyze {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-analyze:disabled { opacity: 0.5; }

        .result-box {
            display: none;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 20px;
            background-color: #0a0a0a;
            margin-top: 10px;
        }

        .result-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888888;
            margin-bottom: 12px;
            border-bottom: 1px solid #222222;
            padding-bottom: 6px;
        }

        .result-content {
            font-size: 13px;
            color: #cccccc;
            line-height: 1.6;
            white-space: pre-line;
        }

        .loader {
            display: none;
            text-align: center;
            font-size: 12px;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>YahaPhotographerApp</header>

    <div class="container">
        <!-- Ввод ключа OpenAI -->
        <div class="input-group">
            <label for="api-key-input">OpenAI API Key (Сохраняется на телефоне)</label>
            <input type="password" id="api-key-input" placeholder="sk-proj-...">
        </div>

        <!-- Загрузка фото -->
        <div class="upload-card" onclick="document.getElementById('file-input').click()">
            <div class="upload-icon" id="upload-icon">┼</div>
            <div class="upload-text" id="upload-text">Нажмите, чтобы добавить фото</div>
            <img id="preview-img" alt="Превью">
        </div>
        <input type="file" id="file-input" accept="image/*" onchange="previewImage(event)">

        <!-- Ввод модели камеры -->
        <div class="input-group">
            <label for="camera-input">Модель фотоаппарата</label>
            <input type="text" id="camera-input" placeholder="Например: Fujifilm X-T4, Canon EOS R6">
        </div>

        <button class="btn-analyze" id="btn-analyze" onclick="analyzePhoto()">Анализ</button>
        <div class="loader" id="loader">Анализируем кадр...</div>

        <div class="result-box" id="result-box">
            <div class="result-title">Инструкция по съемке</div>
            <div class="result-content" id="result-content"></div>
        </div>
    </div>

    <script>
        let base64Image = "";

        // При загрузке восстанавливаем ключ из памяти устройства
        window.onload = function() {
            const savedKey = localStorage.getItem("openai_api_key");
            if (savedKey) {
                document.getElementById("api-key-input").value = savedKey;
            }
        };

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('preview-img');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('upload-icon').style.display = 'none';
                    document.getElementById('upload-text').style.display = 'none';
                    base64Image = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        async function analyzePhoto() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const camera = document.getElementById('camera-input').value.trim();

            if (!apiKey) {
                alert('Пожалуйста, введите ваш API-ключ OpenAI.');
                return;
            }

            if (!base64Image) {
                alert('Пожалуйста, загрузите фотографию.');
                return;
            }

            if (!camera) {
                alert('Пожалуйста, укажите модель фотоаппарата.');
                return;
            }

            // Сохраняем ключ в памяти телефона
            localStorage.setItem("openai_api_key", apiKey);

            const btn = document.getElementById('btn-analyze');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('result-box');
            const resultContent = document.getElementById('result-content');

            btn.disabled = true;
            loader.style.display = 'block';
            resultBox.style.display = 'none';

            const promptText = `Ты — профессиональный фотограф. 
Проанализируй фото и составь руководство, как сделать такой же кадр на камеру: ${camera}.

Формат ответа:
1. ПОЗИЦИЯ И РАКУРС:
(Точка съемки, угол, ракурс)

2. НАСТРОЙКИ КАМЕРЫ (${camera}):
(Диафрагма, выдержка, ISO, фокусное расстояние)

3. СХЕМА ОСВЕЩЕНИЯ:
(Источники света, мягкость, угол)`;

            try {
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [
                            {
                                role: "user",
                                content: [
                                    { type: "text", text: promptText },
                                    { type: "image_url", image_url: { url: base64Image } }
                                ]
                            }
                        ],
                        max_tokens: 700
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices[0]) {
                    resultContent.innerText = data.choices[0].message.content;
                    resultBox.style.display = 'block';
                    resultBox.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('Ошибка API: ' + (data.error?.message || 'Проверьте правильность ключа'));
                }
            } catch (error) {
                alert('Ошибка сети: ' + error.message);
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
